<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-paper-scissor</title>
    <script>
        console.log("hello world");
        let humanScore = 0;
        let computerScore = 0;

        function getComputerChoice() {
            const randomNum = Math.floor(Math.random() * 3);
            switch (randomNum) {
                case 0: return "rock";
                case 1: return "paper";
                case 2: return "scissor";
            }
        }

        function getHumanChoice() {
            let humanChoice = prompt("Enter your choice: rock, paper, or scissor");
            if (!humanChoice) return null;
            humanChoice = humanChoice.toLowerCase();
            if (["rock", "paper", "scissor"].includes(humanChoice)) {
                return humanChoice;
            } else {
                alert("Invalid choice. Please enter rock, paper, or scissor.");
                return getHumanChoice();
            }
        }

        function playRound(humanChoice, computerChoice) {
            if (humanChoice === computerChoice) {
                console.log("It's a tie! User chose: " + humanChoice + ", computer chose: " + computerChoice);
                return;
            }
            if (
                (humanChoice === "rock" && computerChoice === "scissor") ||
                (humanChoice === "paper" && computerChoice === "rock") ||
                (humanChoice === "scissor" && computerChoice === "paper")
            ) {
                humanScore += 1;
                console.log("You win! User chose: " + humanChoice + ", computer chose: " + computerChoice);
            } else {
                computerScore += 1;
                console.log("You lose! User chose: " + humanChoice + ", computer chose: " + computerChoice);
            }
        }

        function playGame(rounds) {
            for (let i = 0; i < rounds; i++) {
                const humanSelection = getHumanChoice();
                if (humanSelection === null) {
                    console.log("Game cancelled.");
                    return;
                }
                const computerSelection = getComputerChoice();
                playRound(humanSelection, computerSelection);
            }
            console.log("Final Scores - User: " + humanScore + ", Computer: " + computerScore);
        }

        playGame(5);
    </script>
</head>
<body>
    
</body>
</html>
